<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión | FitPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styleLog.css" />
  </head>
  <body>
    <main class="login">
      <div class="login__card">
        <header class="login__header">
          <h1 class="login__title">INICIAR SESIÓN</h1>
          <a href="../Home/indexHome.html" aria-label="FitPulse, ir al inicio">
            <img class="login__logo" src="../img/LogoFitpulse.png" alt="FitPulse" />
          </a>
        </header>

        <form class="login__form" id="login-form">
          <label class="visually-hidden" for="email">Correo electrónico</label>
          <input
            class="login__input"
            type="email"
            id="email"
            name="email"
            placeholder="CORREO ELECTRÓNICO"
            autocomplete="email"
            maxlength="150"
            required
          />

          <label class="visually-hidden" for="password">Contraseña</label>
          <input
            class="login__input"
            type="password"
            id="password"
            name="password"
            placeholder="CONTRASEÑA"
            autocomplete="current-password"
            maxlength="128"
            required
          />

          <button class="login__button" type="submit">INGRESAR</button>
          <p class="login__status" id="login-status" role="status" aria-live="polite"></p>
        </form>

        <nav class="login__links">
          <a class="login__link login__link--strong" href="../Register/indexRegister.html"
            >CREAR CUENTA</a
          >
          <a class="login__link" href="#">Olvidé mi contraseña</a>
        </nav>
      </div>
    </main>
    <script src="../js/api.js" defer></script>
    <script src="login.js" defer></script>
    <script src="../js/navigation.js" defer></script>
  </body>
</html>
