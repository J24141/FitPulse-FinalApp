<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta | FitPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../MyAccount-User/styleUser.css">
</head>
<body>
  <header class="header">
    <a class="header__logo" href="../Home/indexHome.html" aria-label="FitPulse, ir al inicio">
      <img src="../img/LogoFitpulse.png" alt="FitPulse">
    </a>
    <nav class="header__nav" aria-label="Principal">
      <a href="../Class/indexClass.html">CLASES</a>
      <a href="#">BLOG</a>
    </nav>
    <div class="header__actions">
      <a class="header__cart" href="../ShopPurshare/indexCarrito.html" aria-label="Carrito de compras">
        <img src="../img/Shopping%20Cart.png" alt="">
      </a>
      <a class="header__avatar" href="indexAccount.html" aria-label="Mi cuenta">
        <img src="../img/UserImg.png" alt="" width="89" height="89">
      </a>
    </div>
  </header>

  <div class="hero">
    <img src="../img/BannerAcount.png" alt="">
  </div>

  <main class="contenido">
    <section class="perfil">
      <img class="perfil__foto" src="../img/UserImg.png" alt="Foto de perfil" width="216" height="216">
      <div class="perfil__texto">
        <h1 class="perfil__nombre" id="account-user-name">Mi cuenta</h1>
        <p class="perfil__email" id="account-user-email"></p>
        <a class="perfil__salir" href="../Log-In/indexLog.html" data-sign-out>CERRAR SESIÓN</a>
      </div>
    </section>

    <section class="seccion" aria-labelledby="titulo-inscripciones">
      <h2 class="seccion__titulo" id="titulo-inscripciones">MIS CLASES · INSCRIPCIÓN GRATUITA</h2>
      <p class="enrollments-status" id="enrollments-status" role="status">Cargando tus clases...</p>
      <div class="clases" id="user-enrollments"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__brand">
        <div>
          <p class="footer__company">© 2026 FitPulse</p>
          <p class="footer__text">Ocho años impulsando tu mejor versión. Reserva, entrena y supera tus límites.</p>
        </div>
        <nav class="footer__social" aria-label="Redes sociales">
          <a href="#" aria-label="Instagram">Instagram</a>
          <a href="#" aria-label="LinkedIn">LinkedIn</a>
          <a href="#" aria-label="X">X</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="../js/api.js" defer></script>
  <script src="../js/navigation.js" defer></script>
  <script src="../js/session.js" defer></script>
  <script src="../MyAccount-User/accountUser.js" defer></script>
  <script src="../MyAccount-User/enrollments.js" defer></script>
</body>
</html>
